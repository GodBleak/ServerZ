stages:
  - check
  - image
  - mirror

default:
  tags:
    - runner-please

variables:
  DOCKER_BUILDKIT: "1"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: "overlay2"
  GITLAB_IMAGE: "$CI_REGISTRY_IMAGE"
  GHCR_IMAGE: "ghcr.io/godbleak/serverz"

check:typescript:
  stage: check
  image: oven/bun:1.3.14

  script:
    - bun install --frozen-lockfile
    - bun run check:config-docs
    - bun run lint
    - bun run typecheck
    - bun run test

publish:images:
  stage: image
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker

  rules:
    - if: '$CI_COMMIT_BRANCH == "beta"'
    - if: "$CI_COMMIT_TAG"

  before_script:
    - docker info
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

  script:
    - |
      set -eu

      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VERSION="${CI_COMMIT_TAG#v}"

        ROOTFUL_TAGS="
          -t $GITLAB_IMAGE:$VERSION
          -t $GITLAB_IMAGE:latest
          -t $GHCR_IMAGE:$VERSION
          -t $GHCR_IMAGE:latest
        "

        ROOTLESS_TAGS="
          -t $GITLAB_IMAGE:$VERSION-rootless
          -t $GITLAB_IMAGE:rootless
          -t $GHCR_IMAGE:$VERSION-rootless
          -t $GHCR_IMAGE:rootless
        "

        PUSH_TAGS="
          $GITLAB_IMAGE:$VERSION
          $GITLAB_IMAGE:latest
          $GHCR_IMAGE:$VERSION
          $GHCR_IMAGE:latest
          $GITLAB_IMAGE:$VERSION-rootless
          $GITLAB_IMAGE:rootless
          $GHCR_IMAGE:$VERSION-rootless
          $GHCR_IMAGE:rootless
        "
      else
        ROOTFUL_TAGS="
          -t $GITLAB_IMAGE:beta
          -t $GHCR_IMAGE:beta
        "

        ROOTLESS_TAGS="
          -t $GITLAB_IMAGE:beta-rootless
          -t $GHCR_IMAGE:beta-rootless
        "

        PUSH_TAGS="
          $GITLAB_IMAGE:beta
          $GHCR_IMAGE:beta
          $GITLAB_IMAGE:beta-rootless
          $GHCR_IMAGE:beta-rootless
        "
      fi

      docker build --pull --target rootful $ROOTFUL_TAGS .
      docker build --pull --target rootless $ROOTLESS_TAGS .

      for tag in $PUSH_TAGS; do
        docker push "$tag"
      done

mirror:github:
  stage: mirror
  image: alpine:latest

  variables:
    GIT_DEPTH: "0"

  resource_group: github-mirror

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  before_script:
    - apk add --no-cache git openssh-client python3
    - git config --global user.name "ServerZ Mirror Bot"
    - git config --global user.email "mirror-bot@godbleak.dev"

    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$GITHUB_DEPLOY_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan github.com >> ~/.ssh/known_hosts

  script:
    - git checkout -B github-mirror "$CI_COMMIT_SHA"

    - |
      python3 <<'PY'
      from pathlib import Path

      path = Path("readme.md")
      readme = path.read_text()

      source_heading = "# ServerZ"
      mirror_notice = "\n".join([
          "# ServerZ",
          "> [!NOTE]",
          "> This is a mirror of [ServerZ on my GitLab instance](https://gitlab.godbleak.dev/godbleak/serverz), and is not the primary repository.",
          "",
      ])

      if readme.startswith(source_heading):
          readme = readme.replace(source_heading, mirror_notice, 1)
      else:
          raise SystemExit("readme.md does not start with '# ServerZ'")

      path.write_text(readme)
      PY

    - git add readme.md
    - 'git commit -m "docs: add GitHub mirror notice [skip ci]"'
    - git remote add github git@github.com:GodBleak/ServerZ.git
    - git push github github-mirror:main --force
